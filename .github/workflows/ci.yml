# En cada push y Pull Request: pruebas de la API contra un PostgreSQL real y build del frontend.
name: CI

on:
  push:
  pull_request:

jobs:
  api:
    name: API (NestJS + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: elcuaderno
          POSTGRES_PASSWORD: elcuaderno_dev
          POSTGRES_DB: elcuaderno_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elcuaderno -d elcuaderno_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://elcuaderno:elcuaderno_dev@localhost:5432/elcuaderno_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - run: npm run build -w @elcuaderno/api
      - run: npm test

  web:
    name: Web (tipos + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @elcuaderno/web
