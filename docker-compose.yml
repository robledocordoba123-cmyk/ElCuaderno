# PostgreSQL para desarrollo local (puerto 5434 para no chocar con otros proyectos).
services:
  db:
    image: postgres:16-alpine
    container_name: elcuaderno_db
    environment:
      POSTGRES_USER: elcuaderno
      POSTGRES_PASSWORD: elcuaderno_dev
      POSTGRES_DB: elcuaderno
    ports:
      - "5434:5432"
    volumes:
      - datos:/var/lib/postgresql/data
volumes:
  datos:
